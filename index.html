<!DOCTYPE html>
<html lang="ru" prefix="og: https://ogp.me/ns#">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <title>STL/3MF Photo Booth — 3D Viewer & Render</title>

        <meta
            name="description"
            content="Бесплатный онлайн-инструмент для просмотра и создания красивых рендеров 3D-моделей (STL, 3MF)."
        />
        <meta
            name="keywords"
            content="STL viewer, 3MF viewer, 3D render online, 3D visualization"
        />
        <meta name="author" content="Herman Guilliman" />
        <meta name="theme-color" content="#1e1e1e" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="yandex-verification" content="51133ed144e8f7d1" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />

        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://stl.guilliman.ru" />
        <meta property="og:title" content="STL/3MF Photo Booth" />
        <meta
            property="og:description"
            content="Просмотр STL и 3MF моделей в браузере"
        />
        <meta property="og:image" content="img/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:site_name" content="STL/3MF Photo Booth" />
        <meta property="og:locale" content="ru_RU" />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="STL/3MF Photo Booth - инструмент для просмотра 3D моделей" />
        <meta name="twitter:description" content="Просмотр STL и 3MF моделей в браузере" />
        <meta name="twitter:image" content="img/og-image.png" />

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="img/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="img/favicon-16x16.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="img/apple-touch-icon.png"
        />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Doto:wght@400..700&family=Space+Grotesk:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap"
            rel="stylesheet"
        />

        <!-- Применяем тему до отрисовки, чтобы избежать вспышки (FOUC) -->
        <script>
            (function () {
                try {
                    var s = localStorage.getItem("stl-viewer-settings");
                    var theme = s && JSON.parse(s).theme;
                    document.documentElement.dataset.theme =
                        theme === "light" ? "light" : "dark";
                } catch (e) {
                    document.documentElement.dataset.theme = "dark";
                }
            })();
        </script>

        <link rel="stylesheet" href="css/style.css" />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebApplication",
                "name": "STL/3MF Photo Booth",
                "description": "Онлайн инструмент для визуализации 3D моделей.",
                "applicationCategory": "DesignApplication",
                "operatingSystem": "All"
            }
        </script>
    </head>
    <body>
        <noscript>
            <div
                style="
                    position: fixed;
                    inset: 0;
                    background: #1e1e1e;
                    color: white;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    text-align: center;
                    padding: 20px;
                    z-index: 9999;
                "
            >
                JavaScript Required / Требуется JavaScript
            </div>
        </noscript>

        <div class="noise-overlay" aria-hidden="true"></div>

        <div id="loader">
            <div class="spinner"></div>
            <div
                id="loaderText"
                style="
                    opacity: 0.7;
                    letter-spacing: 2px;
                    font-size: 11px;
                    font-weight: 600;
                "
            >
                LOADING...
            </div>
        </div>

        <div id="drop-zone" aria-hidden="true" data-lang="dropZone">
            Перетащите STL или 3MF файл сюда
        </div>

        <div id="toast" class="toast-success" role="status"></div>

        <div id="progressOverlay" class="progress-overlay">
            <div class="progress-container">
                <div class="progress-title">Loading...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">0%</div>
            </div>
        </div>

        <div class="ui-panel lang-menu" id="langMenu">
            <div class="lang-opt" onclick="window.setLanguage('ru')">
                <img src="img/flags/ru.png" class="flag-icon" alt="RU" />
                Русский
            </div>
            <div class="lang-opt" onclick="window.setLanguage('en')">
                <img src="img/flags/us.png" class="flag-icon" alt="EN" />
                English
            </div>
            <div class="lang-opt" onclick="window.setLanguage('es')">
                <img src="img/flags/es.png" class="flag-icon" alt="ES" />
                Español
            </div>
            <div class="lang-opt" onclick="window.setLanguage('cn')">
                <img src="img/flags/cn.png" class="flag-icon" alt="CN" /> 中文
            </div>
            <div class="lang-opt" onclick="window.setLanguage('jp')">
                <img src="img/flags/jp.png" class="flag-icon" alt="JP" /> 日本語
            </div>
        </div>

        <aside class="ui-panel info-content" id="helpContent">
            <div class="panel-heading" data-lang="helpDesktop">
                Управление ПК
            </div>
            <div class="shortcut">
                <span data-lang="helpRotate">Вращение</span>
                <span class="key">LMB</span>
            </div>
            <div class="shortcut">
                <span data-lang="helpPan">Панорама</span>
                <span class="key">RMB</span>
            </div>
            <div class="shortcut">
                <span data-lang="helpZoom">Зум</span>
                <span class="key">Scroll</span>
            </div>
            <div
                class="panel-heading panel-heading--mt"
                data-lang="helpTouch"
            >
                Сенсор
            </div>
            <div class="shortcut">
                <span data-lang="helpRotate">Вращение</span>
                <span class="key">1 палец</span>
            </div>
            <div class="shortcut">
                <span data-lang="helpZoomPan">Зум/Панорама</span>
                <span class="key">2 пальца</span>
            </div>
            <a class="feedback-link" href="mailto:admin@guilliman.ru">
                <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                <span data-lang="btnFeedback">Обратная связь</span>
            </a>
            <div class="panel-copyright">© 2025 Herman Guilliman</div>
        </aside>

        <div class="left-column">
            <nav class="ui-panel left-panel" id="toolsPanel" aria-label="Tools">
                <div
                    class="circle-btn tooltip-container"
                    id="helpBtn"
                    role="button"
                    aria-label="Help"
                >
                    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
                    <span class="tooltip" data-lang="tooltipHelp">Справка</span>
                </div>
                <div
                    class="circle-btn tooltip-container"
                    id="mobileZUp"
                    role="button"
                    aria-label="Z-Up"
                >
                    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14"/><path d="m18 13-6-6-6 6"/><path d="M12 7v14"/></svg>
                    <span class="tooltip" data-lang="tooltipZUp">Z вверх</span>
                </div>
                <div
                    class="circle-btn tooltip-container"
                    id="dimBtn"
                    role="button"
                    aria-label="Dimensions"
                >
                    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/><path d="m17.5 15.5 2-2"/></svg>
                    <span class="tooltip" data-lang="tooltipDimensions"
                        >Габариты</span
                    >
                </div>
                <div
                    class="circle-btn tooltip-container"
                    id="bedBtn"
                    role="button"
                    aria-label="Print Bed"
                >
                    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
                    <span class="tooltip" data-lang="tooltipBed"
                        >Стол принтера</span
                    >
                </div>
                <div
                    class="circle-btn tooltip-container"
                    id="themeBtn"
                    role="button"
                    aria-label="Toggle theme"
                >
                    <svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                    <svg class="ic ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                    <span class="tooltip" data-lang="tooltipTheme">Тема</span>
                </div>
            </nav>

            <nav
                class="ui-panel left-panel"
                id="viewPanel"
                aria-label="View Controls"
            >
                <button class="view-btn" onclick="window.setView('iso')">
                    Iso
                </button>
                <button class="view-btn" onclick="window.setView('front')">
                    Frt
                </button>
                <button class="view-btn" onclick="window.setView('top')">
                    Top
                </button>
                <button class="view-btn" onclick="window.setView('side')">
                    Side
                </button>
            </nav>
        </div>

        <main class="ui-panel bottom-bar">
            <div class="action-group main-action">
                <label class="btn btn-primary" role="button" tabindex="0">
                    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
                    <span data-lang="btnOpen">Открыть файл</span>
                    <input type="file" id="fileInput" accept=".stl,.3mf" />
                </label>
            </div>
            <div class="divider"></div>
            <div class="action-group tools-action">
                <button class="btn" id="screenshotSceneBtn">
                    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                    <span data-lang="btnScene">Сцена</span>
                </button>
                <button class="btn" id="screenshotModelBtn">
                    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                    <span data-lang="btnModel">Модель</span>
                </button>
            </div>
        </main>

        <div id="dimLabels" class="dim-overlay">
            <div id="dimX" class="dim-tag"></div>
            <div id="dimY" class="dim-tag"></div>
            <div id="dimZ" class="dim-tag"></div>
        </div>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
